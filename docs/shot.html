<!doctype html><meta charset="utf-8"><title>shot</title>
<body style="margin:0;background:#000">
<iframe id="g" style="width:1080px;height:1920px;border:0;transform:scale(.3);transform-origin:0 0"></iframe>
<script>
// Magaza ekran goruntusu yardimcisi (oyun kodunu degistirmez)
const g=document.getElementById('g');
addEventListener('message',async e=>{
  const d=e.data||{}; if(d.cmd!=='shot')return;
  g.src=d.url;
  await new Promise(r=>g.onload=r);
  const w=g.contentWindow, raf=w.requestAnimationFrame;
  w.requestAnimationFrame=function(cb){return raf.call(w,t=>{cb(t);if(w.__want){w.__want=false;const c=w.document.querySelector('canvas');w.__shot=c.toDataURL('image/png');}})};
  await new Promise(r=>setTimeout(r,d.wait||5000));
  if(d.click){const b=w.document.getElementById(d.click);b&&b.click();await new Promise(r=>setTimeout(r,d.wait2||3000));}
  w.__want=true;
  for(let i=0;i<50&&!w.__shot;i++)await new Promise(r=>setTimeout(r,100));
  let out=w.__shot;
  try{
    await new Promise((res,rej)=>{const sc=w.document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=res;sc.onerror=rej;w.document.head.appendChild(sc);});
    const ov=await w.html2canvas(w.document.body,{backgroundColor:null,ignoreElements:el=>el.tagName==='CANVAS',scale:1,width:w.innerWidth,height:w.innerHeight,logging:false,onclone:(doc)=>{doc.documentElement.style.background='transparent';doc.body.style.background='transparent';const st=doc.getElementById('stage');if(st)st.style.background='transparent';doc.querySelectorAll('canvas').forEach(c=>c.style.visibility='hidden');}});
    const base=new Image();base.src=w.__shot;await base.decode();
    const c=document.createElement('canvas');c.width=base.width;c.height=base.height;const x=c.getContext('2d');x.drawImage(base,0,0);x.drawImage(ov,0,0,c.width,c.height);
    out=c.toDataURL('image/png');
  }catch(err){console.log('overlay fail',err)}
  parent.postMessage({shot:out,name:d.name,w:w.innerWidth,h:w.innerHeight},'*');
});
</script>
<script>
// ?galeri : tek tikla indirilebilir reklam gorselleri (1080x1920)
if(parent===window&&location.search.includes('galeri')){
  g.style.display='none';document.body.style.cssText='background:#111;color:#eee;font:16px sans-serif;padding:12px';
  const info=document.createElement('p');info.textContent='Gorseller hazirlaniyor (≈40 sn)... Her gorselin altindaki baglantidan indirebilirsin.';document.body.appendChild(info);
  g.style.cssText='position:fixed;left:0;top:0;width:1080px;height:1920px;z-index:-1;pointer-events:none;border:0';g.style.display='block';
  const base='/buyucu-satranc/';
  const jobs=[{n:'reklam-1-ana-tahta',u:base+'?v=g1',c:'hPlay'},{n:'reklam-2-oyun',u:base+'?v=g2&fen=r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR_w_KQkq_-_4_4',c:'hPlay'},{n:'reklam-3-vezir-hamlesi',u:base+'?v=g3&fen=rnb1kbnr/pppp1ppp/8/4p3/6Pq/5P2/PPPPP2P/RNBQKBNR_w_KQkq_-_1_3',c:'hPlay'}];
  (async()=>{for(const j of jobs){
    postMessage({cmd:'shot',url:j.u,name:j.n,click:j.c,wait:6000},'*');
    await new Promise(r=>addEventListener('message',function f(e){if(e.data&&e.data.shot&&e.data.name===j.n){removeEventListener('message',f);const a=document.createElement('a');a.href=e.data.shot;a.download=j.n+'.png';a.textContent='⬇ '+j.n+'.png';a.style.cssText='display:block;color:#f5c46b;margin:6px 0';const im=document.createElement('img');im.src=e.data.shot;im.style.cssText='height:360px;display:block;margin-top:12px';document.body.append(im,a);r();}}));
  }info.textContent='Hazir. Baglantilara dokunup indir.';})();
}
</script>
